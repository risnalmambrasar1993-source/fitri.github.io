<script>
const $=s=>document.querySelector(s),esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={get(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let P=LS.get('pn_p',{xp:0,badges:[],name:''}),G=LS.get('pn_g',[]);
const S={view:'home',mode:'bebas',tray:[],hints:0,edit:null,cat:'Alam',inst:'piano',words:[],pi:0,sc:0};

/* ===== DATA ===== */
const CAT={Alam:['hujan','senja','laut','bintang','angin','bulan','embun','ombak','fajar','hutan'],Perasaan:['rindu','haru','sunyi','gelisah','bahagia','lara','damai','cemas','syahdu','getir'],Kehidupan:['perjalanan','waktu','kenangan','jalan','rumah','takdir','langkah','musim','napas','cerita'],Perjuangan:['api','keringat','tangguh','berani','bangkit','karang','pantang','juang','luka','tekad'],Cinta:['kasih','hati','pelukan','janji','bunga','mesra','setia','pelita','dekap','sayang'],Persahabatan:['sahabat','tawa','genggam','bersama','canda','percaya','setia','pundak','kawan','hangat'],Harapan:['harapan','cahaya','mimpi','pagi','doa','semai','tunas','esok','terbang','cita']};
const ALL=new Set(Object.values(CAT).flat());
const TANT=[["Jika laut bisa berbicara, apa yang akan diceritakannya?","Pikirkan apa saja yang pernah ia lihat di pantai.","Beri laut perasaan: marah, rindu, atau bijak?","Gunakan personifikasi: laut berbisik, laut menangis."],["Gambarkan kesedihan tanpa menggunakan kata sedih.","Kesedihan bisa berupa cuaca, warna, atau suara.","Tulis apa yang tampak oleh mata saat hati berat.","Gunakan metafora: kesedihan adalah …"],["Bayangkan dunia tanpa matahari. Tuliskan perasaanmu.","Apa yang akan hilang? Warna, hangat, pagi?","Siapa yang paling merindukan cahaya?","Tutup dengan harapan kecil."],["Jika hujan adalah kenangan, bagaimana kamu menggambarkannya?","Tiap tetes bisa jadi satu peristiwa.","Bagaimana suara hujan di atas atap rumah lama?","Pakai perumpamaan: seperti, bagai, laksana."],["Gambarkan perjuangan seorang ibu melalui metafora.","Ibu bisa jadi pelita, karang, atau sungai.","Apa yang ia korbankan tanpa suara?","Tutup dengan rasa terima kasih."],["Jika alam dapat mengirim surat kepada manusia, apa isinya?","Siapa pengirim: hutan, gunung, atau angin?","Apakah isinya teguran, rindu, atau pesan?","Mulai dengan sapaan: Kepada manusia …"]];
const SCN=[["🌅🏖️🌊","linear-gradient(#ff9f6b,#8b5cf6)","Pantai saat senja","Warna langit apa yang kamu lihat? Apa yang dibisikkan ombak?"],["🧒✨🌌","linear-gradient(#0b1040,#4b2c8a)","Anak kecil memandang langit","Apa yang ia harapkan dari bintang-bintang?"],["🌲🌫️🌲","linear-gradient(#2b4a4a,#9fb4b4)","Hutan berselimut kabut","Suara apa yang tersembunyi di balik kabut?"],["🌊🪨💥","linear-gradient(#1b4b7a,#0b1d3a)","Ombak menghantam karang","Siapa yang lebih kuat, ombak atau karang? Apa maknanya?"],["👩🏠⏳","linear-gradient(#a05a7a,#3a1b5c)","Ibu menunggu anaknya","Apa yang ia pikirkan saat pintu belum terbuka?"],["🐦🪹☁️","linear-gradient(#7ab8f5,#f5c6e0)","Burung terbang meninggalkan sangkar","Apa yang ditinggalkan, apa yang dicari?"]];
const INSTS={piano:['🎹','Piano','tenang & menyentuh'],gitar:['🎸','Gitar Akustik','hangat & romantis'],biola:['🎻','Biola','haru & dramatis'],seruling:['🪈','Seruling','alam & damai'],nusantara:['🥁','Instrumental Nusantara','budaya & kearifan lokal'],ambient:['🌌','Musik Ambient','misterius & imajinatif'],none:['🔇','Tanpa Musik','hanya suara pembaca']};
const LV=['Pemula Kata','Penjelajah Imajinasi','Perangkai Makna','Penyair Kreatif','Maestro Puisi'],TH=[0,100,250,450,700];
const BD={diksi:['Ahli Diksi','📚'],imaj:['Imajinasi Tanpa Batas','🌠'],alam:['Penyair Alam','🌿'],meta:['Maestro Metafora','🔮'],cerita:['Sang Pencerita','📖']};
const lvl=x=>TH.reduce((a,t,i)=>x>=t?i:a,0);

/* ===== STARS ===== */
(function(){const c=$('#stars'),x=c.getContext('2d');let st=[];function rs(){c.width=innerWidth;c.height=innerHeight;st=Array.from({length:90},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.6+.3,p:Math.random()*6}))}
rs();addEventListener('resize',rs);(function d(t){x.clearRect(0,0,c.width,c.height);st.forEach(s=>{x.globalAlpha=.4+.6*Math.abs(Math.sin(t/900+s.p));x.fillStyle=s.r>1.4?'#f6c85f':'#fff';x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill()});requestAnimationFrame(d)})(0)})();

/* ===== AUDIO (Web Audio sintetis) ===== */
let AC,MG,tm=null,ix=0,vol=.5;
const SY={piano:{w:'triangle',sc:[261.6,329.6,392,523.3,440,392,329.6,293.7],b:.75,d:2.2,a:.01,lp:2600},gitar:{w:'sawtooth',sc:[196,246.9,293.7,392,293.7,246.9],b:.42,d:1,a:.004,lp:1300},biola:{w:'sawtooth',sc:[220,261.6,329.6,293.7,246.9,220,196],b:1.2,d:2.4,a:.4,lp:1700},seruling:{w:'sine',sc:[523.3,587.3,659.3,784,880,784,659.3],b:.95,d:1.9,a:.15,lp:4000},nusantara:{w:'sine',sc:[261.6,277.2,311.1,392,415.3,392,311.1,277.2],b:.6,d:2.6,a:.005,lp:3500,bell:1},ambient:{w:'sawtooth',sc:[130.8,164.8,196,246.9,196,164.8],b:2.2,d:4.5,a:1.3,lp:650,pad:1}};
function ac(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=vol;MG.connect(AC.destination)}if(AC.state==='suspended')AC.resume()}
function nt(f,t,d,w,a,lp,g=.3){const o=AC.createOscillator(),e=AC.createGain(),l=AC.createBiquadFilter();o.type=w;o.frequency.value=f;l.type='lowpass';l.frequency.value=lp;e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(g,t+a);e.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(l);l.connect(e);e.connect(MG);o.start(t);o.stop(t+d+.1)}
function tick(){const s=SY[S.inst];if(!s)return;const f=s.sc[ix++%s.sc.length],t=AC.currentTime;nt(f,t,s.d,s.w,s.a,s.lp);if(s.bell)nt(f*2.76,t,s.d*.4,'sine',.005,5000,.12);if(s.pad)nt(f*1.006,t,s.d,s.w,s.a,s.lp,.2);if(S.inst==='piano'&&ix%4==1)nt(f/2,t,3,'sine',.02,900,.25)}
function mStop(){clearInterval(tm);tm=null;mUi()}
function mPlay(){if(S.inst==='none'){mStop();return toast('Instrumen “Tanpa Musik” dipilih.')}try{ac()}catch(e){return toast('Browser tidak mendukung Web Audio.')}mStop0();tick();tm=setInterval(tick,SY[S.inst].b*1000);mUi()}
function mStop0(){clearInterval(tm);tm=null}
function mToggle(){tm?mStop():mPlay()}
function setInst(k){S.inst=k;const was=!!tm;mStop0();if(was&&k!=='none')mPlay();else mUi();document.querySelectorAll('.inst').forEach(e=>e.classList.toggle('act',e.dataset.k===k))}
function setVol(v){vol=v/100;if(MG)MG.gain.value=vol}
function mUi(){const b=$('#mbtn');if(b)b.textContent=tm?'⏸ Jeda':'▶ Putar musik'}
function sfx(f=880){try{ac();nt(f,AC.currentTime,.4,'sine',.01,5000,.15)}catch(e){}}

/* ===== TTS ===== */
const V={ch:'f',st:'tenang',rate:1,pitch:1,vol:1,pause:1.2};let voices=[],speaking=false;
const CH={f:[.95,1.25,'Perempuan lembut'],m:[.9,.75,'Laki-laki tenang'],e:[1.05,1.1,'Ekspresif'],d:[.8,.7,'Narator dramatis']};
const STY={romantis:[.9,1.1,'Romantis'],sedih:[.75,.85,'Sedih & menyentuh'],semangat:[1.15,1.15,'Penuh semangat'],tenang:[.9,1,'Tenang & reflektif'],dramatis:[.8,.8,'Dramatis']};
function ldv(){if('speechSynthesis'in window)voices=speechSynthesis.getVoices()}
if('speechSynthesis'in window){ldv();speechSynthesis.onvoiceschanged=ldv}
function pickVoice(){const id=voices.filter(v=>/^id/i.test(v.lang));const pool=id.length?id:voices;const re=V.ch==='m'||V.ch==='d'?/male|pria|ardi|david|daniel|rizki/i:/female|perempuan|gadis|damayanti|google/i;return pool.find(v=>re.test(v.name))||pool[0]||null}
function stopSpeak(){speaking=false;if('speechSynthesis'in window)speechSynthesis.cancel();document.querySelectorAll('.wave').forEach(w=>w.classList.remove('on'));if(S.mAuto){mStop();S.mAuto=false}}
function speak(text,inst){
 if(!('speechSynthesis'in window)){toast('Maaf, browser ini belum mendukung suara pembaca puisi (Text-to-Speech). Coba Chrome, Edge, atau Safari terbaru.');return}
 if(!text.trim()){toast('Tulis puisimu dulu, baru bisa dibacakan.');return}
 stopSpeak();ldv();speaking=true;
 if(inst){S.inst=inst}if(S.inst!=='none'&&!tm){mPlay();S.mAuto=true}
 const q=[];text.trim().split(/\n\s*\n/).forEach((b,i,a)=>{b.split('\n').filter(l=>l.trim()).forEach(l=>q.push(['s',l.trim()]));if(i<a.length-1)q.push(['w',V.pause*1000])});
 document.querySelectorAll('.wave').forEach(w=>w.classList.add('on'));
 const vc=pickVoice();let i=0;
 (function nx(){if(!speaking)return;if(i>=q.length){stopSpeak();return}const [k,v]=q[i++];if(k==='w'){setTimeout(nx,v);return}
  const u=new SpeechSynthesisUtterance(v);u.lang='id-ID';if(vc)u.voice=vc;u.rate=Math.max(.3,Math.min(2,CH[V.ch][0]*STY[V.st][0]*V.rate));u.pitch=Math.max(.1,Math.min(2,CH[V.ch][1]*STY[V.st][1]*V.pitch/1.1));u.volume=V.vol;u.onend=()=>setTimeout(nx,250);u.onerror=()=>{if(speaking)nx()};speechSynthesis.speak(u)})();
 if(!voices.length)toast('Suara bahasa Indonesia belum terdeteksi; memakai suara bawaan perangkat.');
}

/* ===== PENILAIAN (berbasis aturan, transparan) ===== */
function evaluate(t,title){
 const L=t.split('\n').map(s=>s.trim()).filter(Boolean),W=t.toLowerCase().match(/[a-zà-ÿ]+/g)||[],U=new Set(W),n=Math.max(W.length,1);
 const st=t.split(/\n\s*\n/).filter(s=>s.trim());
 const hits=[...U].filter(w=>ALL.has(w)).length,avg=W.join('').length/n;
 const simile=(t.toLowerCase().match(/\b(seperti|bagai|bagaikan|laksana|ibarat|umpama|adalah)\b/g)||[]).length;
 const pers=(t.toLowerCase().match(/\b(laut|angin|hujan|bulan|bintang|senja|malam|langit|bumi|daun|ombak|fajar|waktu|rindu)\s+(\w+\s)?(ber\w+|me\w+|ter\w+)\b/g)||[]).length;
 let rima=0;for(let i=1;i<L.length;i++){const a=L[i-1].replace(/[^a-z]/gi,'').slice(-2).toLowerCase(),b=L[i].replace(/[^a-z]/gi,'').slice(-2).toLowerCase();if(a&&a===b)rima++}
 const sb=st.map(s=>new Set((s.toLowerCase().match(/[a-z]{5,}/g)||[])));let shared=0;if(sb.length>1){const c={};sb.forEach(s=>s.forEach(w=>c[w]=(c[w]||0)+1));shared=Object.values(c).filter(v=>v>1).length}
 const cl=x=>Math.max(30,Math.min(100,Math.round(x)));
 const sc={kre:cl(40+30*(U.size/n)+Math.min(20,L.length*2.5)),diksi:cl(35+Math.min(45,hits*9)+(avg>=5?12:0)),imaj:cl(35+Math.min(45,(simile+pers)*11)+(L.length>=4?10:0)),bhs:cl(45+Math.min(30,rima*10)+(L.length>=3&&n/L.length<=9?15:0)),kait:cl(40+(st.length>=2?20:0)+Math.min(30,shared*10)+(title&&title!=='Tanpa Judul'?5:0)),pesan:cl(40+Math.min(40,n*1.3)+(L.length>=4?10:0))};
 const tot=Math.round(Object.values(sc).reduce((a,b)=>a+b,0)/6);
 const tip={kre:'Coba pakai kata yang jarang dipakai agar puisimu lebih orisinal.',diksi:'Ganti kata umum dengan diksi yang lebih khas, misalnya dari bank kata.',imaj:'Tambahkan perumpamaan (seperti, bagai) atau personifikasi (angin berbisik).',bhs:'Eksplorasi rima akhir yang senada agar irama lebih indah.',kait:'Bagi puisi menjadi beberapa bait dan ulangi satu kata kunci di antara bait.',pesan:'Tambahkan baris penutup yang menegaskan pesan atau perasaanmu.'};
 const nm={kre:'Kreativitas & orisinalitas',diksi:'Pemilihan diksi',imaj:'Imajinasi',bhs:'Keindahan bahasa',kait:'Keterkaitan antarbait',pesan:'Pesan / makna'};
 const low=Object.entries(sc).sort((a,b)=>a[1]-b[1]).slice(0,2).map(e=>tip[e[0]]);
 const award=tot>=90?'Maestro Kata':tot>=80?'Penyair Imajinatif':tot>=70?'Perangkai Kata':'Terus Berkarya';
 const bad=[];if(sc.diksi>=80)bad.push('diksi');if(sc.imaj>=80)bad.push('imaj');if([...U].filter(w=>CAT.Alam.includes(w)).length>=3)bad.push('alam');if(simile>=2)bad.push('meta');if(st.length>=3)bad.push('cerita');
 return{sc,nm,tot,low,award,bad,n}}

/* ===== UI ===== */
const A=$('#app');
function go(v,o={}){stopSpeak();Object.assign(S,o);S.view=v;render();scrollTo(0,0)}
function topbar(){const l=lvl(P.xp),nx=TH[l+1],pc=nx?(P.xp-TH[l])/(nx-TH[l])*100:100;return`<div class="top"><button class="btn g s" onclick="go('home')">🏠 Beranda</button><b>⭐ Level ${l+1}: ${LV[l]}</b><div class="xp"><div class="bar"><i style="width:${pc}%"></i></div><small class="mut">${P.xp} XP${nx?' / '+nx:' (maks)'}</small></div><button class="btn g s" onclick="go('gallery')">📚 Galeri</button></div>`}
function render(){

function pick(m){const sh=a=>a.sort(()=>Math.random()-.5);Object.assign(S,{mode:m,tray:[],hints:0,edit:null,pi:Math.floor(Math.random()*6),words:sh(Object.values(CAT).flat()).slice(0,10)});sfx(740);go('studio')}

 A.innerHTML=topbar()+`<div class="tabs"><button class="btn act" data-t="w" onclick="tab('w')">✍️ Menulis</button><button class="btn g" data-t="m" onclick="tab('m')">🎼 Musik</button><button class="btn g" data-t="v" onclick="tab('v')">🎙️ Suara</button></div>
 <div id="p-w">${pr}<div class="two"><div class="card"><h3>📚 Bank Kata</h3><div>${cats}</div><div id="bank"></div><div class="row"><input id="cw" placeholder="Kata buatanmu sendiri" style="flex:1" onkeydown="if(event.key==='Enter')addC()"><button class="btn s" onclick="addC()">+ Tambah</button></div><h4>🧺 Kanvas kata (seret untuk menyusun)</h4><div id="tray"></div><div class="row" style="margin-top:8px"><button class="btn s" onclick="toPoem()">⬇ Masukkan ke puisi</button><button class="btn g s" onclick="S.tray=[];tray()">Kosongkan</button></div></div>

function tab(t){stopSpeak();['w','m','v'].forEach(k=>$('#p-'+k).classList.toggle('hide',k!==t));document.querySelectorAll('.tabs .btn').forEach(b=>{b.classList.toggle('act',b.dataset.t===t);b.classList.toggle('g',b.dataset.t!==t)})}

function addT(w){w=w.trim().toLowerCase();if(!w)return;S.tray.push(w);sfx(520+S.tray.length*40);tray()}
function addC(){addT($('#cw').value);$('#cw').value=''}
function tray(){const t=$('#tray');if(!t)return;t.innerHTML=S.tray.length?S.tray.map((w,i)=>`<span class="chip" draggable="true" ondragstart="S.dr=${i}" ondragover="event.preventDefault()" ondrop="mv(S.dr,${i})"><b onclick="mv(${i},${i-1})">‹</b>${esc(w)}<b onclick="mv(${i},${i+1})">›</b><b onclick="S.tray.splice(${i},1);tray()">×</b></span>`).join(''):'<span class="mut">Klik kata di bank untuk memasukkannya ke sini…</span>';bank()}
function mv(a,b){if(b<0||b>=S.tray.length||a==null)return;const[x]=S.tray.splice(a,1);S.tray.splice(b,0,x);sfx(600);tray()}
function toPoem(){if(!S.tray.length)return toast('Pilih beberapa kata dulu.');const t=$('#tx');S.undo=t.value;t.value+=(t.value&&!t.value.endsWith('\n')?'\n':'')+S.tray.join(' ')+'\n';cnt();toast('Kata masuk ke puisi. Kembangkan jadi kalimat indah!')}
function undo(){if(S.undo!=null){const t=$('#tx');const c=t.value;t.value=S.undo;S.undo=c;cnt()}}
function cnt(){const v=$('#tx').value;$('#cnt').textContent=`${(v.match(/\S+/g)||[]).length} kata · ${v.split(/\n\s*\n/).filter(s=>s.trim()).length} bait · ${v.split('\n').filter(s=>s.trim()).length} baris`}
function preview(){const v=$('#tx').value;modal(`<div class="page"><h3>${esc($('#ti').value||'Tanpa Judul')}</h3><small>oleh ${esc($('#au').value||'Penyair Muda')}</small>${esc(v)||'<i>(belum ada isi)</i>'}</div><p><button class="btn" onclick="speak($('#tx').value)">🔊 Bacakan</button> <button class="btn g" onclick="closeM()">Tutup</button></p>`)}
function modal(h){closeM();const m=document.createElement('div');m.className='modal';m.id='mod';m.innerHTML=`<div style="text-align:center;max-width:560px;width:100%">${h}</div>`;document.body.appendChild(m)}
function closeM(){stopSpeak();const m=$('#mod');if(m)m.remove()}

function finish(){
 const t=$('#tx').value.trim(),title=$('#ti').value.trim()||'Tanpa Judul';
 if((t.match(/\S+/g)||[]).length<5)return toast('Tulis dulu sedikitnya 5 kata ya, kamu pasti bisa!');
 if(S.mode==='rangkai'&&!S.edit){const used=S.words.concat(S.tray).filter((w,i,a)=>a.indexOf(w)===i&&new RegExp('\\b'+w+'\\b','i').test(t)).length;if(used<5)return toast(`Pakai minimal 5 kata pilihan di puisimu (baru ${used}).`)}
 P.name=$('#au').value.trim()||P.name;
 const r=evaluate(t,title),isNew=!S.edit,id=S.edit?S.edit.id:Date.now();
 const po={id,title,author:$('#au').value.trim()||'Penyair Muda',theme:$('#th').value.trim()||{rangkai:'Rangkai Kata',tantangan:'Tantangan',gambar:'Puisi Bergambar',bebas:'Bebas'}[S.mode],date:new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}),inst:S.inst,text:t,score:r.tot};
 const i=G.findIndex(g=>g.id===id);i>=0?G[i]=po:G.unshift(po);
 let xp=0,newB=[],up=false;
 if(isNew){const l0=lvl(P.xp);xp=20+Math.round(r.tot/5);P.xp+=xp;up=lvl(P.xp)>l0;r.bad.forEach(b=>{if(!P.badges.includes(b)){P.badges.push(b);newB.push(b)}})}
 save();S.edit=null;sfx(988);
 modal(`<div class="card"><div class="big">📖</div><h2 style="color:var(--gold)">🏅 ${r.award}</h2><h1 style="margin:0">${r.tot}<small>/100</small></h1><p class="mut">Penilaian berbasis aturan yang transparan (bukan AI) – gunakan sebagai panduan belajar.</p><div style="text-align:left">${Object.entries(r.sc).map(([k,v])=>`<div class="sc"><span>${r.nm[k]}</span><div class="bar"><i style="width:${v}%"></i></div><b>${v}</b></div>`).join('')}</div><h3>💡 Saran agar makin indah</h3>${r.low.map(x=>`<p>• ${x}</p>`).join('')}${xp?`<p>✨ +${xp} XP</p>`:''}${up?`<h2 class="badge" style="font-size:1.1rem">🎉 Selamat! Naik ke Level ${lvl(P.xp)+1}: ${LV[lvl(P.xp)]}</h2>`:''}<div>${newB.map(b=>`<span class="badge">${BD[b][1]} ${BD[b][0]}</span>`).join('')}</div><p class="mut">Lencana: ${Object.entries(BD).map(([k,v])=>`<span class="${P.badges.includes(k)?'':'dim'}">${v[1]} ${v[0]}</span>`).join(' · ')}</p><button class="btn" onclick="closeM();go('gallery')">Lihat di Galeri</button> <button class="btn g" onclick="closeM();go('modes')">Main lagi</button></div>`);
}

function gallery(){
 A.innerHTML=topbar()+`<h2>📚 Galeri Puisi</h2>`+(G.length?'':`<div class="card">Belum ada puisi tersimpan. Yuk tulis puisi pertamamu! <br><br><button class="btn" onclick="go('modes')">Mulai Menulis</button></div>`)+`<div class="grid">${G.map((g,i)=>`<div class="card"><div class="page" style="max-height:230px;overflow:auto;animation:none;font-size:.95rem"><h3>${esc(g.title)}</h3><small>${esc(g.author)} · ${esc(g.theme)} · ${g.date}<br>${INSTS[g.inst][0]} ${INSTS[g.inst][1]} · nilai ${g.score}</small>${esc(g.text)}</div><div class="row" style="margin-top:10px"><button class="btn s" onclick="speak(G[${i}].text)">🔊 Baca</button><button class="btn s" onclick="narr(${i})">🎼 Narasi+musik</button><button class="btn g s" onclick="stopSpeak();mStop()">⏹</button><button class="btn g s" onclick="ed(${i})">✏️ Edit</button><button class="btn g s" onclick="dl(${i})">⬇ TXT</button><button class="btn g s" onclick="pr(${i})">🖨 PDF</button><button class="btn g s" onclick="if(confirm('Hapus puisi ini?')){G.splice(${i},1);save();gallery()}">🗑</button></div></div>`).join('')}</div><div class="wave"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>`}
function narr(i){speak(G[i].text,G[i].inst)}
function ed(i){S.edit=G[i];S.mode='bebas';S.inst=G[i].inst;S.tray=[];go('studio')}
function dl(i){const g=G[i],b=new Blob([`${g.title}\noleh ${g.author}\n${g.theme} · ${g.date}\n\n${g.text}\n`],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=g.title.replace(/\W+/g,'_')+'.txt';a.click();toast('Mengunduh… jika tidak berhasil, gunakan tombol 🖨 PDF.')}
function pr(i){const g=G[i],w=window.open('','_blank');if(!w)return toast('Pop-up diblokir. Izinkan pop-up untuk mencetak.');w.document.write(`<title>${esc(g.title)}</title><body style="font-family:Georgia;max-width:600px;margin:40px auto;line-height:1.9"><h1 style="text-align:center">${esc(g.title)}</h1><p style="text-align:center"><i>oleh ${esc(g.author)} · ${g.date}</i></p><pre style="font:inherit;white-space:pre-wrap">${esc(g.text)}</pre>`);w.document.close();w.print()}
render();
</script></body></html>
